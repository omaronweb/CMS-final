<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ما هو المقتطف؟</title>
<style>
@font-face{font-family:"IBM Plex Sans Arabic";src:url(../fonts/IBMPlexSansArabic-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url(../fonts/IBMPlexSansArabic-SemiBold.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url(../fonts/IBMPlexSansArabic-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#5b6577;--line:#e3e6ec;--brand:#1f6f5c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1c2027;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2d333d;--brand:#5cc3a6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:720px;margin:auto;padding:32px 16px 56px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-size:14px}
h2{font-size:20px;margin:32px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
a{color:var(--brand)}
figure{margin:20px 0}
figure img{display:block;max-width:100%;height:auto;margin:auto;border:1px solid var(--line);border-radius:8px}
.ex2{display:grid;gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.box h3{margin:0;padding:8px 12px;font-size:14px;border-bottom:1px solid var(--line)}
.box .in{padding:12px}
.box textarea{width:100%;height:64px;border:1px solid #8c8f94;border-radius:4px;background:var(--bg);font:inherit;color:var(--ink);resize:none}
.box p{margin:8px 0 0;font-size:13px;color:var(--muted)}
figcaption{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.src{margin-top:40px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>ما هو المقتطف؟</h1>

<p>المقتطف نص اختياري يرتبط بالمقالة، ويُستخدم في أغلب الأحيان <strong>ملخصًا للمقالة</strong>.</p>

<figure>
<img src="img/excerpt-box.png" width="522" height="171" alt="صندوق المقتطف في صفحة إضافة مقالة، وفيه ملخص مكتوب">
<figcaption>صندوق المقتطف في صفحة إضافة مقالة</figcaption>
</figure>

<p>بحسب القالب الذي يستخدمه موقعك، يمكن أن تظهر المقتطفات في صفحات مختلفة (نتائج البحث، والأرشيف، وغيرها).</p>

<div class="ex2">
<figure>
<img src="img/excerpt-archive.png" width="804" height="410" alt="صفحة أرشيف تعرض مقالتين، وتحت عنوان كل منهما مقتطفها">
<figcaption>مثال: المقتطف تحت عنوان المقالة في صفحة الأرشيف</figcaption>
</figure>
<figure>
<img src="img/excerpt-search.png" width="804" height="477" alt="صفحة نتائج بحث، وتحت كل نتيجة مقتطف المقالة">
<figcaption>مثال: المقتطف وصفًا لكل نتيجة في صفحة البحث</figcaption>
</figure>
</div>

<p>إذا كان المقتطف فارغًا، يُنشأ مقتطف تلقائيًا من أول 55 كلمة في المقالة.</p>

<p class="src"><a href="../post-new__post_type-article.html">العودة إلى إضافة مقالة</a></p>
</main>
<script src="../proto-bar.js"></script>
</body>
</html>
