name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Browsers keep custom.css and proto.js for ~10 minutes, so a new deploy
      # can look unchanged; tag them with this commit so every deploy is fetched fresh
      - name: Cache-bust prototype CSS/JS
        run: |
          v="${GITHUB_SHA::7}"
          find . -name '*.html' -not -path './.git/*' -print0 | xargs -0 sed -i \
            -e "s#href=\"custom\.css\"#href=\"custom.css?v=$v\"#g" \
            -e "s#src=\"proto\.js\"#src=\"proto.js?v=$v\"#g"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
